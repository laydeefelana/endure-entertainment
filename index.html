<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endure Entertainment | One Vision. Many Voices.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Montserrat:wght@200;300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-pale: #F5E6B8;
  --gold-dim: rgba(201,168,76,0.15);
  --black: #0A0A0A;
  --black-soft: #111111;
  --black-mid: #1A1A1A;
  --white: #FAFAF7;
  --gray: #777770;
  --gray-light: #AAAAAA;
  --green: #2d8a2d;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--black); color:var(--white); font-family:'Montserrat',sans-serif; overflow-x:hidden; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:18px 60px; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to bottom,rgba(10,10,10,0.97),transparent);
  backdrop-filter:blur(8px);
}
.nav-logo { font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; color:var(--gold); letter-spacing:0.15em; text-transform:uppercase; text-decoration:none; }
.nav-links { display:flex; gap:35px; list-style:none; }
.nav-links a { font-size:0.68rem; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:var(--gray-light); text-decoration:none; transition:color 0.3s; }
.nav-links a:hover { color:var(--gold); }

.hero {
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:120px 20px 80px; position:relative; overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#1e1500 0%,var(--black) 65%);
}
.hero-bg-text {
  position:absolute; font-family:'Playfair Display',serif;
  font-size:clamp(6rem,18vw,20rem); font-weight:900;
  color:rgba(201,168,76,0.03); pointer-events:none; user-select:none;
  white-space:nowrap; top:50%; left:50%; transform:translate(-50%,-50%);
}
.hero-eyebrow { font-size:0.65rem; letter-spacing:0.5em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:20px; animation:fadeUp 1.2s ease both; }
.umbrella-logo { width:clamp(280px,50vw,480px); margin:20px auto; animation:fadeUp 1.2s ease 0.2s both; filter:drop-shadow(0 10px 40px rgba(201,168,76,0.2)); }
.hero-rule { width:1px; height:60px; background:linear-gradient(to bottom,transparent,var(--gold),transparent); margin:25px auto; animation:fadeUp 1.2s ease 0.4s both; }
.hero-tagline { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(1.1rem,3vw,1.9rem); color:var(--gray-light); animation:fadeUp 1.2s ease 0.5s both; }
.hero-tagline span { color:var(--gold-light); }
.hero-desc { max-width:580px; margin:20px auto 0; font-size:0.88rem; font-weight:300; line-height:1.9; color:var(--gray); animation:fadeUp 1.2s ease 0.6s both; }
.hero-cta { display:flex; gap:20px; justify-content:center; margin-top:40px; animation:fadeUp 1.2s ease 0.75s both; flex-wrap:wrap; }
.btn-primary { padding:14px 40px; background:var(--gold); color:var(--black); font-size:0.7rem; font-weight:700; letter-spacing:0.3em; text-transform:uppercase; text-decoration:none; transition:all 0.3s; }
.btn-primary:hover { background:var(--gold-light); transform:translateY(-2px); }
.btn-outline { padding:14px 40px; border:1px solid rgba(201,168,76,0.4); color:var(--gold); font-size:0.7rem; font-weight:700; letter-spacing:0.3em; text-transform:uppercase; text-decoration:none; transition:all 0.3s; }
.btn-outline:hover { border-color:var(--gold); background:rgba(201,168,76,0.05); transform:translateY(-2px); }
.scroll-indicator { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; }
.scroll-indicator span { font-size:0.55rem; letter-spacing:0.4em; text-transform:uppercase; color:var(--gray); }
.scroll-line { width:1px; height:50px; background:linear-gradient(to bottom,var(--gold),transparent); animation:scrollPulse 2s ease infinite; }

.awards-bar { background:linear-gradient(90deg,#0f0c00,#1a1300,#0f0c00); border-top:1px solid rgba(201,168,76,0.3); border-bottom:1px solid rgba(201,168,76,0.3); padding:14px 0; overflow:hidden; white-space:nowrap; }
.awards-track { display:inline-block; animation:ticker 40s linear infinite; }
.awards-track span { font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold-light); font-weight:600; margin:0 40px; }
.awards-track .sep { color:var(--gold); opacity:0.5; margin:0 10px; }

.show-section { padding:100px 60px; display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; max-width:1200px; margin:0 auto; }
.show-label { font-size:0.6rem; letter-spacing:0.5em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:20px; }
.show-title { font-family:'Playfair Display',serif; font-size:clamp(2.5rem,5vw,4.5rem); font-weight:900; line-height:1; margin-bottom:10px; }
.show-subtitle { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1rem; color:var(--gold-light); letter-spacing:0.1em; margin-bottom:25px; }
.show-divider { width:60px; height:2px; background:var(--gold); margin-bottom:25px; opacity:0.6; }
.show-desc { font-size:0.88rem; font-weight:300; line-height:1.9; color:var(--gray-light); margin-bottom:20px; }
.show-catchphrase { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1rem; color:var(--gold); margin-bottom:30px; padding:15px 20px; border-left:3px solid var(--gold); background:rgba(201,168,76,0.05); }
.show-host { display:flex; align-items:center; gap:15px; margin-bottom:30px; }
.host-avatar { width:56px; height:56px; border-radius:50%; border:2px solid var(--gold); overflow:hidden; flex-shrink:0; }
.host-avatar img { width:100%; height:100%; object-fit:cover; }
.host-info .host-name { font-size:0.88rem; font-weight:600; color:var(--white); }
.host-info .host-title { font-size:0.7rem; color:var(--gray); letter-spacing:0.05em; line-height:1.5; }
.show-visual { position:relative; border:1px solid var(--gold-dim); overflow:hidden; }
.show-visual img { width:100%; display:block; }
.show-visual-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.5) 0%,transparent 50%); }
.live-badge { position:absolute; top:20px; left:20px; background:#c0392b; color:white; font-size:0.55rem; font-weight:700; letter-spacing:0.3em; padding:5px 12px; text-transform:uppercase; display:flex; align-items:center; gap:6px; z-index:2; }
.live-dot { width:6px; height:6px; border-radius:50%; background:white; animation:blink 1.5s ease infinite; }

.achievements-section { padding:80px 60px; background:linear-gradient(135deg,#0f0c00,var(--black-mid),#0f0c00); border-top:1px solid var(--gold-dim); border-bottom:1px solid var(--gold-dim); }
.achievements-inner { max-width:1100px; margin:0 auto; }
.section-eyebrow { font-size:0.6rem; letter-spacing:0.5em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:20px; text-align:center; }
.section-title { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,4vw,3rem); font-weight:900; margin-bottom:15px; text-align:center; }
.section-title span { color:var(--gold); }
.gold-rule { width:80px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto 50px; }
.achievements-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:20px; }
.achievement-card { background:rgba(201,168,76,0.04); border:1px solid rgba(201,168,76,0.15); border-top:3px solid var(--gold); padding:30px 25px; text-align:center; transition:all 0.3s; }
.achievement-card:hover { background:rgba(201,168,76,0.08); transform:translateY(-3px); }
.achievement-icon { font-size:1.8rem; margin-bottom:12px; }
.achievement-org { font-size:0.6rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px; }
.achievement-title { font-family:'Playfair Display',serif; font-size:0.95rem; color:var(--white); line-height:1.3; }

.active-section { padding:100px 60px; max-width:1200px; margin:0 auto; }
.active-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:30px; margin-top:50px; }
.active-card { background:var(--black-soft); border:1px solid rgba(201,168,76,0.2); border-top:4px solid var(--gold); overflow:hidden; transition:all 0.4s; position:relative; }
.active-card:hover { transform:translateY(-6px); box-shadow:0 25px 60px rgba(201,168,76,0.12); border-color:var(--gold); }
.active-card-img { width:100%; height:200px; object-fit:cover; object-position:top; display:block; }
.active-card-img-placeholder { width:100%; height:200px; background:linear-gradient(135deg,#1a1300,#0a0a0a); display:flex; align-items:center; justify-content:center; font-size:3rem; }
.active-badge { position:absolute; top:15px; right:15px; background:var(--gold); color:var(--black); font-size:0.55rem; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; padding:4px 10px; }
.active-card-body { padding:30px; }
.active-card-label { font-size:0.6rem; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px; }
.active-card-title { font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--white); margin-bottom:8px; }
.active-card-sub { font-size:0.75rem; color:var(--gold-light); letter-spacing:0.1em; margin-bottom:15px; }
.active-divider { width:40px; height:1px; background:var(--gold); margin-bottom:15px; opacity:0.5; }
.active-card-desc { font-size:0.83rem; color:var(--gray-light); line-height:1.8; font-weight:300; margin-bottom:20px; }
.active-card-contact { font-size:0.75rem; color:var(--gold); }

.shows-list { margin-top:15px; }
.show-item { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid rgba(201,168,76,0.08); }
.show-item:last-child { border-bottom:none; }
.show-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0; }
.show-item-text { font-size:0.8rem; color:var(--gray-light); line-height:1.5; }
.show-item-text strong { color:var(--white); display:block; }
.coming-soon-tag { font-size:0.6rem; color:var(--gold); letter-spacing:0.2em; text-transform:uppercase; }

.coming-section { padding:100px 60px; max-width:1200px; margin:0 auto; }
.spokes-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:2px; margin-top:50px; }
.spoke-card { background:var(--black-soft); border:1px solid rgba(201,168,76,0.08); padding:30px 22px; position:relative; overflow:hidden; transition:all 0.4s; }
.spoke-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0; transition:opacity 0.4s; }
.spoke-card:hover::before { opacity:1; }
.spoke-card:hover { background:var(--black-mid); transform:translateY(-3px); }
.spoke-icon { font-size:1.4rem; margin-bottom:12px; opacity:0.8; }
.spoke-name { font-family:'Playfair Display',serif; font-size:0.95rem; color:var(--white); margin-bottom:8px; }
.spoke-desc { font-size:0.76rem; color:var(--gray); line-height:1.7; font-weight:300; }
.spoke-tagline { font-size:0.7rem; color:var(--gold-light); font-style:italic; margin-top:6px; }
.spoke-soon { display:inline-block; margin-top:10px; font-size:0.6rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); font-weight:600; }

.about-section { padding:100px 60px; background:linear-gradient(180deg,var(--black) 0%,#0f0d00 50%,var(--black) 100%); text-align:center; }
.about-inner { max-width:800px; margin:0 auto; }
.about-text { font-size:0.92rem; font-weight:300; line-height:2; color:var(--gray-light); margin-bottom:20px; }
.about-quote { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(1.3rem,3vw,2rem); color:var(--gold-light); margin:40px 0; line-height:1.5; }
.founder-block { display:inline-flex; align-items:center; gap:20px; margin-top:35px; padding:25px 40px; border:1px solid var(--gold-dim); background:rgba(201,168,76,0.03); }
.founder-avatar { width:70px; height:70px; border-radius:50%; border:2px solid var(--gold); overflow:hidden; flex-shrink:0; }
.founder-avatar img { width:100%; height:100%; object-fit:cover; }
.founder-info { text-align:left; }
.founder-name { font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--white); margin-bottom:4px; }
.founder-role { font-size:0.7rem; letter-spacing:0.2em; color:var(--gold); text-transform:uppercase; }
.founder-tagline { font-size:0.75rem; color:var(--gray); margin-top:4px; font-style:italic; }

.contact-section { padding:100px 60px; background:linear-gradient(135deg,#0f0c00,var(--black-mid),#0f0c00); border-top:1px solid var(--gold-dim); text-align:center; }
.contact-inner { max-width:600px; margin:0 auto; }
.contact-desc { font-size:0.9rem; font-weight:300; color:var(--gray-light); line-height:1.9; margin-bottom:40px; }
.contact-links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:40px; }
.contact-link { padding:12px 25px; border:1px solid var(--gold-dim); color:var(--gold-light); font-size:0.68rem; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; text-decoration:none; transition:all 0.3s; }
.contact-link:hover { border-color:var(--gold); background:var(--gold-dim); }
.donate-btn { display:inline-block; padding:16px 50px; background:linear-gradient(135deg,var(--gold),#b8922a); color:var(--black); font-size:0.75rem; font-weight:700; letter-spacing:0.3em; text-transform:uppercase; text-decoration:none; transition:all 0.3s; }
.donate-btn:hover { transform:translateY(-3px); box-shadow:0 15px 40px rgba(201,168,76,0.25); }

footer { padding:50px 60px; background:var(--black); border-top:1px solid rgba(201,168,76,0.1); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px; }
.footer-logo { font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; color:var(--gold); letter-spacing:0.1em; margin-bottom:5px; }
.footer-tag { font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gray); font-size:0.88rem; }
.footer-right { font-size:0.65rem; color:rgba(136,136,128,0.5); letter-spacing:0.2em; text-transform:uppercase; }

@keyframes fadeUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
@keyframes scrollPulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
@keyframes ticker { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }

@media(max-width:900px) {
  nav { padding:18px 25px; }
  .nav-links { display:none; }
  .show-section,.active-section,.coming-section,.about-section,.contact-section,.achievements-section { padding:70px 25px; }
  .show-section { grid-template-columns:1fr; gap:40px; }
  footer { padding:40px 25px; flex-direction:column; text-align:center; }
}
@media(max-width:600px) {
  .hero-cta { flex-direction:column; align-items:center; }
  .achievements-grid { grid-template-columns:1fr 1fr; }
  .founder-block { flex-direction:column; text-align:center; }
  .founder-info { text-align:center; }
}
</style>
</head>
<body>

<nav>
  <a href="#home" class="nav-logo">Endure Entertainment</a>
  <ul class="nav-links">
    <li><a href="#show">BonaFide Talk</a></li>
    <li><a href="#achievements">Awards</a></li>
    <li><a href="#active">Our Work</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>
